name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compart:
    name: mail.compartsoftware.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "08d6ee75890a687e032ba5439dd5e1ae"
          command: deploy

  shortena:
    name: mail.shortena.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_SHORTENA || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "08d6ee75890a687e032ba5439dd5e1ae"
          command: deploy --env shortena
